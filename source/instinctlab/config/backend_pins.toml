# Pinned simulator backends installed with InstinctLab.
# Used by setup.py extras and scripts/install.py. Do not use uv.

[isaaclab]
git = "https://github.com/isaac-sim/IsaacLab.git"
commit = "f73c331738"
packages = [
    "isaaclab",
    "isaaclab_assets",
    "isaaclab_tasks",
    "isaaclab_rl",
    "isaaclab_mimic",
]

[mjlab]
git = "https://github.com/mujocolab/mjlab.git"
tag = "v1.5.0"
pypi = "mjlab==1.5.0"
runtime = [
    "mujoco==3.10.0",
    "mujoco-warp==3.10.0.1",
    "warp-lang==1.14.0",
]
