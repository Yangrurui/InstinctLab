[package]

# Semantic Versioning is used: https://semver.org/
version = "0.1.0"

# Description
category = "robotics"
readme  = "../../README.md"

title = "InstinctLab"
author = "Project Instinct"
maintainer = "YangRurui"
description = "Engine-neutral humanoid reinforcement-learning tasks for Isaac Sim and MJLab"
repository = "https://github.com/project-instinct/instinctlab"
keywords = ["humanoid", "reinforcement-learning", "isaac-sim", "mjlab"]
license = "CC-BY-NC-4.0"

[dependencies]
# Simulator dependencies are supplied by the selected engine wheel. The task
# application itself remains importable without either SDK.

[[python.module]]
name = "instinctlab"

