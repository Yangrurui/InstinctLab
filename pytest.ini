[pytest]
testpaths = tests
# Repo root on sys.path so `from tests.foo` works under bare `pytest` as well as
# `python -m pytest` (the latter already puts cwd on the path).
pythonpath = .
# Default collection must not start a real engine. Isaac and MJLab cannot share a process.
# Point at the file: Kit parses sys.argv, and Isaac must start before torch.
#   pytest -o addopts= -m mjlab tests/simulators/test_mjlab_behavior.py
#   pytest -o addopts= -m isaacsim tests/simulators/test_isaacsim_behavior.py
addopts = -m "not mjlab and not isaacsim"
markers =
    mjlab: live MJLab GPU backend tests; not collected by default
    isaacsim: live Isaac Sim GPU backend tests; not collected by default
