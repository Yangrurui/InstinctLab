[pytest]
testpaths = tests
# Repo root on sys.path so `from tests.foo` works under bare `pytest` as well as
# `python -m pytest` (the latter already puts cwd on the path).
pythonpath = .
# Default collection must not start a real engine. Isaac and MJLab cannot share a process.
# Live Isaac suite (one Kit per module; set INSTINCTLAB_LIVE_DEVICE if CUDA_VISIBLE_DEVICES remaps):
#   CUDA_VISIBLE_DEVICES=1 INSTINCTLAB_LIVE_DEVICE=cuda:0 pytest tests -m isaacsim
# That session collects only isaacsim-marked files and runs each module in its
# own process. A second AppLauncher hangs (CPU ~100%, GPU 0, SIGTERM ignored).
# A second make_env on the same Kit hangs the same way with GPU occupied.
# Importing mjlab first loads site-packages warp 1.16, which has no types.array.
# Point at one file when you only want that file:
#   pytest -o addopts= -m mjlab tests/simulators/test_mjlab_behavior.py
#   pytest -o addopts= -m isaacsim tests/simulators/test_isaacsim_behavior.py
addopts = -m "not mjlab and not isaacsim"
markers =
    mjlab: live MJLab GPU backend tests; not collected by default
    isaacsim: live Isaac Sim GPU backend tests; not collected by default
