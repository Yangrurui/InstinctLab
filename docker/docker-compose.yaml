x-instinctlab-gpu: &instinctlab-gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

services:
  instinctlab:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        INSTINCTLAB_RUNTIME_IMAGE: ${INSTINCTLAB_RUNTIME_IMAGE:?set an immutable dual-backend image@sha256 reference}
        INSTINCTLAB_SOURCE_COMMIT: ${INSTINCTLAB_SOURCE_COMMIT:?operator helper records the clean source commit}
    image: ${INSTINCTLAB_APPLICATION_IMAGE:-instinctlab:0.1.0}
    container_name: instinctlab
    network_mode: host
    environment:
      INSTINCTLAB_DATA_ROOT: /datasets
      OMNI_KIT_ALLOW_ROOT: "1"
    volumes:
      - type: bind
        source: ${INSTINCTLAB_HOST_DATA_ROOT:?set the host dataset root}
        target: /datasets
        read_only: true
      - type: bind
        source: ${INSTINCTLAB_HOST_LOG_ROOT:-../logs}
        target: /workspace/logs
    deploy: *instinctlab-gpu
    entrypoint: bash
    stdin_open: true
    tty: true
