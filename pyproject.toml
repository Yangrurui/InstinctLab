[build-system]
requires = ["setuptools<82.0.0", "toml"]
build-backend = "setuptools.build_meta"

[tool.isort]

atomic = true
profile = "black"
line_length = 120
py_version = 311
skip_glob = ["docs/*", "logs/*"]
group_by_package = true

sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "ISAACLABPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
extra_standard_library = [
    "numpy",
    "h5py",
    "open3d",
    "torch",
    "tensordict",
    "bpy",
    "matplotlib",
    "gymnasium",
    "gym",
    "scipy",
    "hid",
    "yaml",
    "prettytable",
    "toml",
    "trimesh",
    "tqdm",
    "psutil",
]
known_thirdparty = [
    "isaacsim.core.api",
    "omni.replicator.core",
    "pxr",
    "omni.kit.*",
    "warp",
    "carb",
    "Semantics",
]
known_isaaclabparty = [
    "isaaclab",
    "isaaclab_tasks",
    "isaaclab_assets",
    "isaaclab_mimic",
    "isaaclab_rl"
]

# Modify the following to include the package names of your first-party code
known_firstparty = "instinctlab"
known_local_folder = "config"

[tool.pyright]

include = [
    "scripts/build_release.py",
    "scripts/check_release.py",
    "scripts/check_ruff_ratchet.py",
    "scripts/install.py",
    "scripts/play.py",
    "scripts/train.py",
    "scripts/verify_wheel_matrix.py",
    "source/instinctlab/instinctlab",
    "source/instinctlab_engine/src",
    "source/instinctlab_engine_isaacsim/src",
    "source/instinctlab_engine_mjlab/src",
]

exclude = [
    "**/__pycache__",
    "**/build",
    "**/docs",
    "**/logs",
    ".git",
    ".vscode",
]

typeCheckingMode = "basic"
pythonVersion = "3.11"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true

# This is required as the CI pre-commit does not download the module (i.e. numpy, torch, prettytable)
# Therefore, we have to ignore missing imports
reportMissingImports = "none"
# This is required to ignore for type checks of modules with stubs missing.
reportMissingModuleSource = "none" # -> most common: prettytable in mdp managers

reportGeneralTypeIssues = "none"       # -> raises 218 errors (usage of literal MISSING in dataclasses)
reportArgumentType = "none"            # dynamic SDK manager protocols are intentionally structural
reportAssignmentType = "none"          # configclass assigns native SDK values after bootstrap
reportAttributeAccessIssue = "none"    # native environment surfaces are selected at runtime
reportCallIssue = "none"                # engine factories expose backend-specific call signatures
reportIndexIssue = "none"               # native tensor/index containers lack complete stubs
reportInvalidTypeForm = "none"          # configclass fields use runtime-resolved SDK config types
reportOperatorIssue = "none"            # Warp/native numeric values have incomplete operator stubs
reportOptionalOperand = "none"          # SDK configs validate optional fields during construction
reportOptionalSubscript = "none"        # SDK configs validate optional fields during construction
reportReturnType = "none"               # adapters return runtime protocol implementations
reportOptionalMemberAccess = "warning" # -> raises 8 errors
reportPrivateUsage = "warning"
