name: Build and publish coordinated release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact coordinated package version
        required: true
      publish:
        description: Publish verified artifacts to PyPI
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate coordinated version and build clean artifacts
        run: |
          python scripts/check_release.py --expected-version "${{ inputs.version }}"
          python scripts/build_release.py --expected-version "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: instinctlab-${{ inputs.version }}
          path: dist/release/
          if-no-files-found: error

  verify-gates:
    if: inputs.publish
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require the coordinated version tag
        env:
          EXPECTED_TAG: v${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Publication requires ref $EXPECTED_TAG, got $GITHUB_REF_TYPE $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Require every release gate on this exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              "PR fast SDK-free checks",
              "Isolated package and wheel matrix",
              "Scheduled and release GPU live checks",
              "Release candidate operator gates",
            ];
            const response = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: context.sha,
                status: "completed",
                per_page: 100,
              },
            );
            const passed = new Set(
              response
                .filter((run) => run.head_sha === context.sha && run.conclusion === "success")
                .map((run) => run.name),
            );
            const missing = required.filter((name) => !passed.has(name));
            if (missing.length) {
              core.setFailed(
                `Commit ${context.sha} lacks successful release gates: ${missing.join(", ")}`,
              );
            }

  publish:
    if: inputs.publish && needs.verify-gates.result == 'success'
    needs: [build, verify-gates]
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: instinctlab-${{ inputs.version }}
          path: dist/release
      - name: Select Python distributions for publication
        run: |
          mkdir -p dist/publish
          cp dist/release/*.whl dist/release/*.tar.gz dist/publish/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/publish/
