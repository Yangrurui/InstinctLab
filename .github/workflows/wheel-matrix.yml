name: Isolated package and wheel matrix

on:
  pull_request:
    paths:
      - "source/**"
      - "scripts/verify_wheel_matrix.py"
      - "scripts/check_release.py"
      - "tests/fixtures/external_extension/**"
      - ".github/workflows/wheel-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-wheels:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install wheel probe dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build torch numpy PyYAML packaging toml
      - run: python scripts/check_release.py
      - run: python scripts/verify_wheel_matrix.py
