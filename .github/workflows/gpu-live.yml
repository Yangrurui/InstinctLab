name: Scheduled and release GPU live checks

on:
  schedule:
    - cron: "17 3 * * 1"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      device:
        description: CUDA device for live extension probes
        default: "cuda:0"
        required: true

permissions:
  contents: read

concurrency:
  group: instinctlab-gpu-live
  cancel-in-progress: false

jobs:
  dual-backend-live:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Inspect shared runner state
        run: |
          pgrep -af scripts/train.py || true
          nvidia-smi
      - name: Verify pinned dependencies
        run: /root/miniconda3/envs/env_isaaclab/bin/python scripts/install.py
      - name: Run both native extension probes from isolated wheels
        run: |
          device="${{ inputs.device || 'cuda:0' }}"
          /root/miniconda3/envs/env_isaaclab/bin/python scripts/verify_wheel_matrix.py \
            --matrix both --live-extension --live-device "$device"
      - name: Verify MJLab runtime pins
        run: /root/miniconda3/envs/env_isaaclab/bin/python scripts/check_mjlab.py
